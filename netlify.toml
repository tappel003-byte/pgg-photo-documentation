# Netlify site settings for TanStack Start + Nitro (netlify preset is auto-detected).
# Publish is the Nitro public output root (`dist/`), not `dist/client`.
[build]
  command = "bun run build"
  publish = "dist"

# Required env vars (see docs/nlf-office-env.md): NLF_OFFICE_PASSWORD, NLF_SESSION_SECRET,
# NLF_FIELD_KEY, SECRETS_SCAN_OMIT_KEYS=NLF_FIELD_KEY.
